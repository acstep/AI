<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 AI 新聞庫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8}
.container{max-width:760px;margin:0 auto;padding:36px 22px 60px}
.header{padding:8px 0 24px;border-bottom:3px solid #111827;margin-bottom:8px}
.header h1{font-size:2rem;font-weight:800;letter-spacing:.02em}
.header .subtitle{color:#6b7280;font-size:.88rem;margin-top:8px}
.stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.stat .n{font-size:1.5rem;font-weight:800;color:#111827;line-height:1.2}
.stat .l{font-size:.76rem;color:#9ca3af}
.section{margin-top:36px}
.section-title{font-size:1.15rem;font-weight:700;padding-bottom:10px;border-bottom:1px solid #e5e7eb;margin-bottom:14px}
.section-title .cnt{font-size:.8rem;font-weight:500;color:#9ca3af;margin-left:6px}
.list{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:18px;background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#9ca3af;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.date{flex:0 0 66px;text-align:center;border-right:1px solid #f3f4f6;padding-right:14px}
.date .d{font-size:1.7rem;font-weight:800;color:#111827;line-height:1}
.date .ym{font-size:.7rem;color:#9ca3af;margin-top:2px}
.date .wd{font-size:.72rem;color:#6b7280;margin-top:2px}
.info{flex:1;min-width:0}
.ttl{font-size:1.02rem;font-weight:700;color:#111827}
.badge{display:inline-block;font-size:.66rem;font-weight:700;color:#ffffff;background:#2563eb;border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:6px}
.note{font-size:.82rem;color:#6b7280;margin-top:3px}
.meta{font-size:.76rem;color:#9ca3af;margin-top:5px}
.arrow{font-size:1.5rem;color:#d1d5db;flex:0 0 auto}
.empty{text-align:center;color:#9ca3af;font-size:.88rem;padding:40px 0}
.footer{text-align:center;color:#9ca3af;font-size:.78rem;margin-top:56px;padding-top:20px;border-top:1px solid #f3f4f6}
@media(max-width:600px){.header h1{font-size:1.5rem}.container{padding:24px 16px 48px}.card{gap:12px;padding:14px}.date{flex:0 0 54px;padding-right:10px}.date .d{font-size:1.4rem}}
</style>
</head>
<body>
<div class="container">
<div class="header">
  <h1>📚 AI 新聞庫</h1>
  <div class="subtitle">各期 AI 新聞彙整 · 點日期進入該期</div>
  <div class="stats">
    <div class="stat"><div class="n">1</div><div class="l">期報告</div></div>
    <div class="stat"><div class="n">100</div><div class="l">則新聞</div></div>
    <div class="stat"><div class="n">2026-10-10</div><div class="l">最新一期</div></div>
  </div>
</div>

<div class='section'>
    <div class='section-title'>2026 年 10 月 <span class='cnt'>1 期</span></div>
    <div class='list'><a class='card' href='2026-10-10.html'>
      <div class='date'>
        <div class='d'>10</div>
        <div class='ym'>2026 / 10</div>
        <div class='wd'>週六</div>
      </div>
      <div class='info'>
        <div class='ttl'>AI 本週速報 <span class='badge'>最新</span></div>
        <div class='note'>本週彙整 10-03 ~ 10-10</div>
        <div class='meta'>100 則</div>
      </div>
      <div class='arrow'>&rsaquo;</div>
    </a></div>
  </div>

<div class="footer">以上為研究整理、僅供參考 · 標註「據報／傳」者屬未經當事人證實之消息</div>
</div>
</body>
</html>
